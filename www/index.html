<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Registro offline de treinos de força: Push, Pull, Legs e reforço opcional. Progressão, RIR, deload e histórico.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treino Força">
  <title>Treino Força</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6.5 6.5v11M3.5 9v5M17.5 6.5v11M20.5 9v5M6.5 12h11"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>Treino Força</h1>
          <p id="topbar-sub">Carregando…</p>
        </div>
      </div>
      <div class="topbar-side">
        <span id="net-pill" class="pill" title="Modo offline">offline ok</span>
        <button id="btn-install-top" class="icon-btn" type="button" hidden aria-label="Instalar app" title="Instalar app">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12M8 11l4 4 4-4M5 20h14"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="views">
      <section class="view" id="view-dashboard" data-view="dashboard" aria-label="Dashboard">
        <div id="dash-content"></div>
      </section>

      <section class="view" id="view-treino" data-view="treino" aria-label="Treino" hidden>
        <div id="treino-content"></div>
      </section>

      <section class="view" id="view-historico" data-view="historico" aria-label="Histórico" hidden>
        <div id="historico-content"></div>
      </section>

      <section class="view" id="view-progresso" data-view="progresso" aria-label="Progresso" hidden>
        <div id="progresso-content"></div>
      </section>

      <section class="view" id="view-ajuda" data-view="ajuda" aria-label="Ajuda e glossário" hidden>
        <div id="ajuda-content"></div>
      </section>

      <section class="view" id="view-config" data-view="config" aria-label="Configurações" hidden>
        <div id="config-content"></div>
      </section>
    </main>

    <div id="rest-timer" class="rest-timer" hidden aria-live="polite">
      <div class="rest-timer-body">
        <div class="rest-timer-label" id="rest-label">Descanso</div>
        <div class="rest-timer-time" id="rest-time">2:30</div>
      </div>
      <div class="rest-timer-actions">
        <button type="button" class="btn btn-sm btn-ghost" data-timer="plus">+15s</button>
        <button type="button" class="btn btn-sm btn-ghost" data-timer="toggle">Pausar</button>
        <button type="button" class="btn btn-sm btn-ghost" data-timer="reset">Zerar</button>
        <button type="button" class="icon-btn" data-timer="close" aria-label="Fechar timer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>

    <nav class="tabbar" aria-label="Navegação principal">
      <button type="button" class="tab is-active" data-nav="dashboard" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Dashboard</span>
      </button>
      <button type="button" class="tab" data-nav="treino">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 6.5v11M3.5 9v5M17.5 6.5v11M20.5 9v5M6.5 12h11"/></svg>
        <span>Treino</span>
      </button>
      <button type="button" class="tab" data-nav="historico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>Histórico</span>
      </button>
      <button type="button" class="tab" data-nav="progresso">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-6 4 3 6-8"/><path d="M15 6h4v4"/></svg>
        <span>Progresso</span>
      </button>
      <button type="button" class="tab" data-nav="ajuda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5"/><circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/></svg>
        <span>Ajuda</span>
      </button>
      <button type="button" class="tab" data-nav="config">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
        <span>Config</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="onboarding" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="app.js" defer></script>
</body>
</html>
