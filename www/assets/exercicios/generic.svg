<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="titulo">
  <title id="titulo">Movimento controlado: segure a descida e respire</title>
  <style>
    .weight, .ring { transform-box: fill-box; transform-origin: center; }
    .weight { animation: float 2.8s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
    .ring { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .18; transform: scale(.92); } 50% { opacity: .5; transform: scale(1); } }
    .arrow { animation: blink 2.8s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .weight, .ring, .arrow { animation: none; } }
  </style>
  <rect width="320" height="200" rx="18" fill="#10161a"/>
  <circle class="ring" cx="160" cy="104" r="62" fill="none" stroke="#5ee0b5" stroke-width="1.5"/>
  <circle class="ring" cx="160" cy="104" r="46" fill="none" stroke="#5ee0b5" stroke-width="1"/>
  <g class="weight">
    <rect x="98" y="100" width="124" height="9" rx="4.5" fill="#dfe8ef"/>
    <rect x="86" y="86" width="18" height="37" rx="6" fill="#5ee0b5"/>
    <rect x="70" y="92" width="12" height="25" rx="5" fill="#5ee0b5" opacity=".55"/>
    <rect x="216" y="86" width="18" height="37" rx="6" fill="#5ee0b5"/>
    <rect x="238" y="92" width="12" height="25" rx="5" fill="#5ee0b5" opacity=".55"/>
  </g>
  <g class="arrow" fill="none" stroke="#5ee0b5" stroke-width="2" stroke-linecap="round">
    <path d="M118 154v-8m0 0-4 4m4-4 4 4"/>
    <path d="M202 154v-8m0 0-4 4m4-4 4 4"/>
  </g>
</svg>
